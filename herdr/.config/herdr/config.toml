onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

auto_switch = false
[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "reset"
surface_dim = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
# herdr matches the typed character: bindings on h/j/k/l also list the ru layout keys р/о/л/д.
split_horizontal = ["prefix+h", "prefix+р", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

# Navigate mode keys (herdr defaults h/j/k/l) with the ru layout keys
navigate_pane_left = ["h", "р"]
navigate_pane_down = ["j", "о"]
navigate_pane_up = ["k", "л"]
navigate_pane_right = ["l", "д"]

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = ["prefix+k", "prefix+л"]
switch_tab = ["prefix+1..9", "alt+1..9"]
# alt+h/l repeat alt+left/right. alt+j/k stay with Neovim (LazyVim moves lines with them).
# herdr matches the typed character, so the ru layout keys (р, д) are listed too.
previous_tab = ["prefix+p", "alt+left", "alt+h", "alt+р"]
next_tab = ["prefix+n", "alt+right", "alt+l", "alt+д"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = ["prefix+shift+k", "prefix+shift+л"]
# alt+shift+k/j repeat alt+up/down; alt+j/k without shift stay with Neovim. л, о are the ru layout keys.
previous_workspace = ["prefix+shift+p", "alt+up", "alt+shift+k", "alt+shift+л"]
next_workspace = ["prefix+shift+n", "alt+down", "alt+shift+j", "alt+shift+о"]

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

# Like christoomey/vim-tmux-navigator in tmux: ctrl+h/j/k/l moves between herdr panes and Neovim splits.
# The actions come from the vim-herdr-navigation plugin (paulbkim-dev/vim-herdr-navigation, pinned to
# 7873100eb47212269005c693effb2a844986b30f); Neovim loads editor/nvim.lua of the same repo from ~/dotfiles/nvim.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"

# The same actions on the ru layout keys
[[keys.command]]
key = "ctrl+р"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+о"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+л"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+д"
type = "plugin_action"
command = "vim-herdr-navigation.right"

# Outside Vim ctrl+l moves the herdr focus; prefix+ctrl+l sends ctrl+l (clear screen) to the focused pane,
# like prefix C-l with vim-tmux-navigator in tmux. д is the ru layout key.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = 'herdr pane send-keys "$(herdr pane current | jq -r .result.pane.pane_id)" ctrl+l'

[[keys.command]]
key = "prefix+ctrl+д"
type = "shell"
command = 'herdr pane send-keys "$(herdr pane current | jq -r .result.pane.pane_id)" ctrl+l'
