# ~/.config/tmux/tmux.conf  (dotfiles: stow tmux)
#
# Порядок важен: TPM читает список @plugin из ЭТОГО файла (XDG-путь имеет
# приоритет над ~/.tmux.conf) и из файлов, подключённых через source-file.

# 1. База: стоковый конфиг Omarchy (обновляется вместе с omarchy update).
source-file -q ~/.local/share/omarchy/config/tmux/tmux.conf

# 2. Личные правки поверх Omarchy.
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# 3. Плагины.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# TPM: на новом устройстве клонируем и ставим плагины автоматически.
if-shell 'test ! -d ~/.config/tmux/plugins/tpm' \
  "run-shell 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run-shell '~/.config/tmux/plugins/tpm/tpm'
